<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luxury Living Design — Leonardo Chávez</title>
<style>
html{background:#fff;-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#555}
main{max-width:1400px;margin:0 auto}
main img{display:block;width:100%;height:auto;opacity:0;transform:translateY(18px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
main img.in{opacity:1;transform:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#end{height:1px}
#msg{padding:48px 24px;text-align:center}
@media (prefers-reduced-motion:reduce){main img{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>
<h1 class="vh">Luxury Living Design — Leonardo Chávez</h1>
<main id="m"></main>
<div id="end"></div>
<div id="msg" hidden></div>
<script>
/* Carga los bloques p1-01.webp, p1-02.webp ... p2-01.webp ... en orden, conforme bajas.
   Las busca solo en la carpeta img/ (ignora cualquier .webp suelto en la raíz).
   No depende de cuántos bloques haya. */
(function(){
  var m=document.getElementById("m"), end=document.getElementById("end"), msg=document.getElementById("msg");
  var prefix=null, p=1, k=1, busy=false, done=false, count=0;
  function name(){return "p"+p+"-"+(k<10?"0":"")+k+".webp"}
  function load(cb){
    var tries=["img/"];
    (function t(i){
      if(i>=tries.length){cb(false);return}
      var im=new Image();
      im.decoding="async"; im.alt="";
      im.onload=function(){
        prefix=tries[i]; m.appendChild(im);
        requestAnimationFrame(function(){requestAnimationFrame(function(){im.className="in"})});
        cb(true);
      };
      im.onerror=function(){t(i+1)};
      im.src=tries[i]+name();
    })(0);
  }
  function check(){
    if(done||busy)return;
    if(end.getBoundingClientRect().top<window.innerHeight*2)next();
  }
  function next(){
    if(busy||done)return;
    busy=true;
    load(function(ok){
      busy=false;
      if(ok){count++;k++;check();return}
      if(k>1){p++;k=1;next();return}
      done=true;
      if(!count){msg.hidden=false;msg.textContent='No encuentro las imágenes. Revisa que la carpeta "img" (con p1-01.webp, p1-02.webp...) esté subida junto a este index.html.'}
    });
  }
  window.addEventListener("scroll",check,{passive:true});
  window.addEventListener("resize",check);
  next();
})();
</script>
</body>
</html>
